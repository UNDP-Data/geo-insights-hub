apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: Namespace
metadata:
  name: marimo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-hub
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insights-hub
  template:
    metadata:
      labels:
        app: insights-hub
    spec:
      nodeSelector:
        type: insights
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "insights"
          effect: "NoSchedule"
      containers:
      - name: web
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: hub-env
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: insights-hub-svc
  namespace: ${NAMESPACE}
spec:
  selector:
    app: insights-hub
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insights-hub-route
  namespace: ${NAMESPACE}
spec:
  parentRefs:
  - name: cluster-gateway
    namespace: default
  hostnames:
  - "${HOSTNAME}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: insights-hub-svc
      port: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-secret-reader
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hub-env"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-secret-reader-binding
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: hub-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# 2. Define the permissions in the target 'marimo' namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: marimo
  name: insightshub-spawner-role
rules:
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
# 3. Grant these permissions to your InsightsHub pod in ${NAMESPACE}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insightshub-spawner-binding
  namespace: marimo
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: insightshub-spawner-role
  apiGroup: rbac.authorization.k8s.io
