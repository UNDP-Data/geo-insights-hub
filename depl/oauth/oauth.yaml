apiVersion: v1
kind: Namespace
metadata:
  name: "${NAMESPACE}"
---
apiVersion: v1
kind: Secret
metadata:
  name: github-oauth-creds
  namespace: "${NAMESPACE}"
type: Opaque
stringData:
  client-id: "${OAUTH_CLIENT_ID}"
  client-secret: "${OAUTH_CLIENT_SECRET}"
  cookie-secret: "${OAUTH_COOKIE_KEY}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-oauth
  namespace: "${NAMESPACE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-oauth
  template:
    metadata:
      labels:
        app: github-oauth
    spec:
      containers:
      - name: oauth-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: "github"
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: github-oauth-creds
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-oauth-creds
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: github-oauth-creds
              key: cookie-secret
        - name: OAUTH2_PROXY_GITHUB_ORG
          value: "${OAUTH_ORG_NAME}"
        - name: OAUTH2_PROXY_GITHUB_TEAM
          value: "${OAUTH_TEAM_NAME}"
        - name: OAUTH2_PROXY_HTTP_ADDRESS
          value: "0.0.0.0:4180"
        - name: OAUTH2_PROXY_UPSTREAMS
          value: "static://200"
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: "${OAUTH2_PROXY_COOKIE_DOMAINS}"
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: "${OAUTH2_PROXY_WHITELIST_DOMAINS}"
        - name: OAUTH2_PROXY_COOKIE_SECURE
          value: "true"
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: "${OAUTH2_PROXY_EMAIL_DOMAINS}"
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: "https://${AUTH_SUBDOMAIN}.${BASE_DOMAIN}/oauth2/callback"
        - name: OAUTH2_PROXY_SCOPE
          value: "user:email,read:org,repo"
        - name: OAUTH2_PROXY_REVERSE_PROXY
          value: "true"
        - name: OAUTH2_PROXY_SET_XAUTHREQUEST
          value: "true"
        - name: OAUTH2_PROXY_PASS_USER_HEADERS
          value: "true"
        - name: OAUTH2_PROXY_VERBOSE
          value: "true"
        - name: OAUTH2_PROXY_LOGGER_JSON
          value: "false"
        - name: OAUTH2_PROXY_SET_AUTHORIZATION_HEADER
          value: "true"
        - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: github-oauth-svc
  namespace: "${NAMESPACE}"
spec:
  ports:
  - port: 4180
    targetPort: 4180
    protocol: TCP
    name: http
  selector:
    app: github-oauth
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: github-oauth-route
  namespace: "${NAMESPACE}"
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: default
  hostnames:
    - "${AUTH_SUBDOMAIN}.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: github-oauth-svc
          namespace: "${NAMESPACE}"
          port: 4180