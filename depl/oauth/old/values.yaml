config:
  clientID: "${OAUTH_CLIENT_ID}"
  clientSecret: "${OAUTH_CLIENT_SECRET}"
  cookieSecret: "${OAUTH_COOKIE_KEY}"
  configFile: |-
    provider = "github"
    email_domains = [ "*" ]
    github_org = "${OAUTH_ORG_NAME}"
    github_team = "${OAUTH_TEAM_NAME}"
    scope = "user:email,read:org,repo"
    redirect_url = "https://${AUTH_SUBDOMAIN}.${BASE_DOMAIN}/oauth2/callback"
    cookie_secure = true
    cookie_httponly = true
    reverse_proxy = true
    set_xauthrequest = true
    pass_user_headers = true
    pass_access_token = true
    cookie_domains = ["${OAUTH2_PROXY_COOKIE_DOMAINS}"]
    whitelist_domains = ["${OAUTH2_PROXY_WHITELIST_DOMAINS}"]
    upstreams = [ "static://200" ]

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi