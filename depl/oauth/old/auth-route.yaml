apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-oauth-route
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
  hostnames:
    - "${AUTH_SUBDOMAIN}.${BASE_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: github-oauth-oauth2-proxy
          port: 80

