apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-shared-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /shared
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-shared-data
  namespace: marimo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: pv-shared-data
  resources:
    requests:
      storage: 10Gi