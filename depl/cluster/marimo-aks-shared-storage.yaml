apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-shared-data
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    volumeHandle: undpdpbppssdganalyticsgeo#undpgeohub#insights
    volumeAttributes:
      shareName: insights
    nodeStageSecretRef:
      name: azure-storage-secret
      namespace: marimo
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=1000
    - gid=1000
    - mfsymlinks
    - cache=strict
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-shared-data
  namespace: marimo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  volumeName: pv-shared-data
  resources:
    requests:
      storage: 100Gi