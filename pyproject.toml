[project]
name = "insightshub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn>=0.54.0",
    "fastapi>=0.142.2",
    "nicegui>=3.17.1",
    "pydantic-settings>=2.15.0",
    "gitpython>=3.2.0",
    "marimo>=0.25.1",
    "kubernetes>=37.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightshub"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "win-64",
    "osx-arm64",
]
